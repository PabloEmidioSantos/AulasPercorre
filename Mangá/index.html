<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu manga online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <img src="public/dragonballbanner.jpg" alt="Dragon Ball Banner" class="banner">
        </div>

        <h1 class="title">Dragon Ball vol. 1</h1>

    </header>
        
    <button class="btn2" data-direction="previous">Anterior</button>
    <span class="progress">1–10 / 31</span>
    <button class="btn2" data-direction="next">Próximo</button>


    <main>
        <img class="cover" src="public/dragon-ball-vol-1-s%20Capa.jpg" alt="Capa de Dragon Ball volume 1" fetchpriority="high">

        <img src="public/1.jpg" alt="Página 1" fetchpriority="high">
        <img src="public/2.jpg" alt="Página 2" loading="lazy">
        <img src="public/3.jpg" alt="Página 3" loading="lazy">
        <img src="public/4.jpg" alt="Página 4" loading="lazy">
        <img src="public/5.jpg" alt="Página 5" loading="lazy">
        <img src="public/6.jpg" alt="Página 6" loading="lazy">
        <img src="public/7.jpg" alt="Página 7" loading="lazy">
        <img src="public/8.jpg" alt="Página 8" loading="lazy">
        <img src="public/9.jpg" alt="Página 9" loading="lazy">
        <img src="public/10.jpg" alt="Página 10" loading="lazy">
    </main>

    <button class="btn" data-direction="previous">Anterior</button>
    <span class="progress">1–10 / 31</span>
    <button class="btn" data-direction="next">Próximo</button>

<script src="script.js"></script>
</body>
</html>
